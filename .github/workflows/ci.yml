name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  # Integration tests connect to the service containers below.
  DATABASE_URL: postgresql://varys_owner:varys_owner_pw@localhost:5432/varys
  DATABASE_DIRECT_URL: postgresql://varys_owner:varys_owner_pw@localhost:5432/varys
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-secret-please-change
  INTERNAL_SERVICE_SECRET: ci-internal-secret-please-change
  NODE_ENV: test
  # Stub values required by @varys/config at test bootstrap (not real API keys).
  GEMINI_API_KEY: ci-stub
  LLM_GATEWAY_URL: http://localhost:3001

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: varys_owner
          POSTGRES_PASSWORD: varys_owner_pw
          POSTGRES_DB: varys
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varys_owner -d varys"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Test gate: unit + integration tests run against the postgres+redis services above.
      # Production deployment only proceeds when this job (incl. tests) succeeds.
      - name: Test
        run: pnpm test

  docker-build:
    # Verify all service images build cleanly; no push (push happens in deploy).
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - qa-gateway
          - llm-gateway
          - qa-orchestrator
          - qa-unit-worker
          - qa-sandbox-worker
          - qa-aggregator
          - doc-ingestor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SERVICE=${{ matrix.service }}
          tags: varys/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    # Tests + Docker builds must pass before any production deployment.
    needs: [build-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation for GCP auth
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all service images
        env:
          REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/varys
          TAG: ${{ github.sha }}
        run: |
          for svc in qa-gateway llm-gateway qa-orchestrator qa-unit-worker qa-sandbox-worker qa-aggregator doc-ingestor; do
            docker build --build-arg SERVICE=$svc -t $REGISTRY/$svc:$TAG -t $REGISTRY/$svc:latest .
            docker push $REGISTRY/$svc:$TAG
            docker push $REGISTRY/$svc:latest
          done

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GCP_REGION }}

      - name: Helm upgrade
        env:
          REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/varys
          TAG: ${{ github.sha }}
        run: |
          helm upgrade --install varys infra/helm/varys \
            --set image.registry=$REGISTRY \
            --set image.tag=$TAG \
            --atomic --timeout 10m \
            --namespace varys --create-namespace
