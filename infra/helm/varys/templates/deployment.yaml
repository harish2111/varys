{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }}, part-of: varys }
spec:
  replicas: {{ $svc.replicas.min }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      {{- with $svc.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: varys-config }
            - secretRef: { name: varys-secrets }
          {{- if eq $svc.type "http" }}
          ports:
            - containerPort: {{ $svc.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
          resources: {{ toYaml $svc.resources | nindent 12 }}
{{- end }}
