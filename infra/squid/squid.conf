# Squid egress allowlist for the sandbox network (spec §5.8, §16).
# Only vendor sandbox domains are reachable; all other egress is denied.
# In production this allowlist is generated from api_document_namespaces domains.
http_port 3128

# --- Per-vendor sandbox allowlist (extend as namespaces are added) ---
acl allowed_dst dstdomain api.fathom.ai
acl allowed_dst dstdomain .superops.ai
acl allowed_dst dstdomain api.hubapi.com

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 443
acl Safe_ports port 80

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow allowed_dst
http_access deny all

# Do not leak internal topology.
forwarded_for delete
via off
